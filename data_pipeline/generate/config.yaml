# =============================================================
# config.yaml
# Central configuration for the AI-Powered Criminal/Cyber Fraud
# Network Analysis System (SIH Project)
# =============================================================

project:
  name: "AI-Powered Criminal/Cyber Fraud Network Analysis System"
  random_seed: 42          # Fixed randomness for 100% reproducibility
  disclaimer: >
    All data generated by this project is 100% synthetic and fictional.
    No real persons, phone numbers, devices, IPs, accounts, locations,
    organizations or cases are used or represented.

# -------------------------------------------------------------
# Entity counts — Stage 1 Test Dataset (Small & Rich)
# -------------------------------------------------------------
entities:
  persons: 100
  phones: 300
  devices: 120
  ips: 120
  accounts: 150
  locations: 120
  organizations: 20
  cases: 20

# -------------------------------------------------------------
# Event volume & Temporal Span
# -------------------------------------------------------------
events:
  total_events: 7500
  start_date: "2025-01-01"
  end_date: "2025-12-31"

# -------------------------------------------------------------
# Behavioral pattern mix (Proportion of population)
# Used ONLY for generation logic. Kept strictly isolated from ML input features.
# -------------------------------------------------------------
behavior_patterns:
  normal_users: 0.70            # Standard baseline activity
  highly_connected: 0.05        # Hubs with broad connectivity
  cluster_members: 0.08         # Dense fraud syndicates / mule networks
  sudden_activity_spike: 0.04   # Rapid escalation in volume
  rapid_location_change: 0.03   # Impossible velocity hops (>800 km/h)
  shared_infrastructure_anomaly: 0.03 # Fraud farm / SIM box reuse
  shared_infrastructure_normal: 0.02  # Legitimate household / cafe WiFi sharing
  communication_burst: 0.02     # Short rapid-fire ping calls
  ambiguous_legitimate: 0.03    # High-volume merchant / frequent traveler (NORMAL)

# -------------------------------------------------------------
# ID formatting — Stable, non-PII primary keys
# -------------------------------------------------------------
id_prefixes:
  person: "PER_"
  phone: "PH_"
  device: "DEV_"
  ip: "IP_"
  account: "ACC_"
  location: "LOC_"
  organization: "ORG_"
  case: "CASE_"
  event: "EVT_"

id_padding: 6   # e.g., PER_000001

# -------------------------------------------------------------
# File paths (relative to project root)
# -------------------------------------------------------------
paths:
  raw_data: "data/raw/"
  cleaned_data: "data/cleaned/"
  processed_data: "data/processed/"
  ground_truth: "data/ground_truth/"
  outputs: "outputs/"
  sample_data: "outputs/sample/"
  neo4j_exports: "neo4j/import/"

# -------------------------------------------------------------
# Future scale target (Reference for subsequent scaling)
# -------------------------------------------------------------
scale_target:
  persons: 100000
  events: 750000
